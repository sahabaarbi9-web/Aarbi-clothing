# ============================================================
# AARBI CLOTHING — Railway deployment config
# Ye repo root static website + backend dono rakhta hai.
# Railway ko DOCKERFILE builder se backend chalane ke liye bataya
# gaya hai, taaki staticfile (Caddy) ke bajaye Express API chale.
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Sirf backend/frontend/Dockerfile changes par redeploy ho
watchPatterns = [
  "inventory-dashboard/backend/**",
  "inventory-dashboard/frontend/**",
  "Dockerfile",
  "railway.toml",
]

[deploy]
# Rails se pahle yeh route serve ho to deploy healthy samjho
healthcheckPath = "/api/products"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3